<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minisim Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a results wall. A wide 3D theatre view with the orbit view
     beside it, a strip of four follow cameras underneath, and a timeline along
     the bottom. Single dark theme by choice, shared with minisim Studio. */
  color-scheme: dark;
  --ink: #0d1422;
  --panel: #151e30;
  --raised: #1d2840;
  --line: #2b3854;
  --text: #dbe2ee;
  --muted: #8794ad;
  --accent: #f2b544;
  --bad: #f2788f;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font: 13px/1.45 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { height: 100%; display: grid; gap: 1px; background: var(--line);
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) minmax(120px, 24%) auto;
  grid-template-areas: "bar bar" "theatre globe" "cams cams" "time time"; }
.app.nosat { grid-template-areas: "bar bar" "theatre theatre" "cams cams" "time time"; }
.app > * { background: var(--panel); min-width: 0; min-height: 0; }

.bar { grid-area: bar; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px; }
.brand { font-weight: 600; font-size: 14px; letter-spacing: .02em; }
.brand span { color: var(--accent); }
.name { color: var(--muted); }
.spacer { flex: 1; }
.btn, .bar select, .bar input[type="number"] { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }
.btn { cursor: pointer; white-space: nowrap; text-decoration: none; color: inherit; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1404; font-weight: 600; }
.bar form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bar label { color: var(--muted); }
.bar input[type="number"] { width: 64px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { flex-basis: 100%; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.note.bad { color: var(--bad); }
.note:empty { display: none; }

.view { position: relative; overflow: hidden; background: var(--ink); }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.view canvas:active { cursor: grabbing; }
.theatre { grid-area: theatre; }
.globe { grid-area: globe; }
.tag { position: absolute; left: 10px; top: 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); pointer-events: none; }
.legend { position: absolute; right: 10px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: flex-end;
  background: rgba(13,20,34,.72); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 12px; max-width: 70%; }
.legend label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.events { position: absolute; left: 10px; bottom: 8px; max-width: 62%; font: 12px/1.5 var(--font-mono); color: var(--text);
  background: rgba(13,20,34,.72); border-radius: 4px; padding: 4px 8px; pointer-events: none; }
.events:empty { display: none; }
.events b { color: var(--muted); font-weight: 500; }
.events b.bad { color: var(--bad); }
.readout { position: absolute; right: 10px; bottom: 8px; font: 12px var(--font-mono); text-align: right; pointer-events: none;
  background: rgba(13,20,34,.72); border-radius: 4px; padding: 3px 8px; }
.readout:empty { display: none; }

.cams { grid-area: cams; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.cam { position: relative; overflow: hidden; background: var(--ink); min-height: 0; }
.cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cam select { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 12px); background: rgba(13,20,34,.8);
  border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font-size: 12px; }

.time { grid-area: time; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; }
.time input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.time select { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
.clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.result { border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; color: var(--text); }

@media (max-width: 820px) {
  .app, .app.nosat { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
    grid-template-areas: "bar" "theatre" "time" "globe" "cams"; }
  .theatre { height: 72vw; min-height: 260px; }
  .globe { height: 64vw; min-height: 240px; }
  .cams { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cam { height: 38vw; min-height: 130px; }
  .legend { max-width: none; left: 10px; top: 28px; justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">minisim <span>Replay</span></div>
    <div class="name" id="scenario-name"></div>
    <span class="spacer"></span>
    <form id="run-form">
      <span id="local" hidden>
        <label for="scenario">Scenario</label> <select id="scenario"></select>
        <label for="seed">Seed</label> <input id="seed" type="number" min="1" max="99999" value="3">
        <button class="btn primary" type="submit">Run and replay</button>
        <a class="btn" href="./">Studio</a>
      </span>
    </form>
    <label class="btn filebtn">Open replay file<input id="file" type="file" accept=".json,application/json"></label>
    <div class="note" id="note" aria-live="polite"></div>
  </header>

  <section class="view theatre" aria-label="Battle area in 3D">
    <canvas id="theatre" aria-label="3D view of the battle area. Drag to rotate, scroll to zoom, click a unit for details."></canvas>
    <div class="tag">Battle area</div>
    <div class="legend">
      <label><input type="checkbox" id="show-comms" checked><i style="color:#5b8def"></i>Comms links</label>
      <label><input type="checkbox" id="show-seen" checked><i style="color:#f2d04a;border-top-style:dashed"></i>Detections</label>
      <label><input type="checkbox" id="show-shots" checked><i style="color:#ff6b57"></i>Shots</label>
      <label><input type="checkbox" id="show-labels" checked>Names</label>
    </div>
    <div class="events" id="events"></div>
    <div class="readout" id="readout"></div>
  </section>

  <section class="view globe" id="globe-wrap" aria-label="Orbit view">
    <canvas id="globe" aria-label="Globe showing satellites and the battle area. Drag to rotate, scroll to zoom."></canvas>
    <div class="tag">Orbit view</div>
  </section>

  <section class="cams" aria-label="Follow cameras">
    <div class="cam"><canvas id="cam-0"></canvas><select id="cam-0-pick" aria-label="Camera 1 follows"></select></div>
    <div class="cam"><canvas id="cam-1"></canvas><select id="cam-1-pick" aria-label="Camera 2 follows"></select></div>
    <div class="cam"><canvas id="cam-2"></canvas><select id="cam-2-pick" aria-label="Camera 3 follows"></select></div>
    <div class="cam"><canvas id="cam-3"></canvas><select id="cam-3-pick" aria-label="Camera 4 follows"></select></div>
  </section>

  <footer class="time">
    <button class="btn" id="btn-play" type="button" aria-pressed="true">Pause</button>
    <input id="scrub" type="range" min="0" max="100" step="1" value="0" aria-label="Time in the run">
    <span class="clock" id="clock">00:00 / 00:00</span>
    <label for="speed" class="name">speed</label>
    <select id="speed">
      <option value="10">10x</option>
      <option value="30" selected>30x</option>
      <option value="60">60x</option>
      <option value="150">150x</option>
    </select>
    <span class="result" id="result"></span>
  </footer>
</div>

    const s = Math.max(4, Math.min(9, cam.scale * 2 / q.depth));
    ctx.globalAlpha = 0.6; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(q.x - s, q.y - s); ctx.lineTo(q.x + s, q.y + s); ctx.moveTo(q.x - s, q.y + s); ctx.lineTo(q.x + s, q.y - s); ctx.stroke();
    ctx.globalAlpha = 1;
    return q;
  }
  const [polys, rotates] = ICONS[u.icon] || ICONS.default;
  if (u.domain === "air" && !u.landed) {
    line3(ctx, cam, at, W3(u.x, u.y, terrainHeight(u.x, u.y)), color, 1, null, 0.45);       // height above ground
    const ch = Math.cos(u.heading * D), sh = Math.sin(u.heading * D);
    const ok = iconPath(ctx, polys, ([px, py]) => {
      const lx = rotates ? px : py, ly = rotates ? py : -px;
      return cam.project([u.x + sizeKm * (lx * ch - ly * sh), u.y + sizeKm * (lx * sh + ly * ch), u.z * VZ]);
    });
    if (ok) { ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = "#0d1422"; ctx.lineWidth = 0.8; ctx.stroke(); }
  } else {                                           // ground units stand upright, facing the viewer
    const s = Math.max(5, Math.min(26, cam.scale * sizeKm * 0.9 / q.depth));
    iconPath(ctx, polys, ([px, py]) => ({ x: q.x + px * s, y: q.y - s - py * s }));
    ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = "#0d1422"; ctx.lineWidth = 0.8; ctx.stroke();
  }
  if (u.n === selected) {
    ctx.strokeStyle = "#f2b544"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 13, 0, 2 * Math.PI); ctx.stroke();
  }
  if (label) {
    ctx.font = "11px 'IBM Plex Sans', sans-serif"; ctx.fillStyle = "#dbe2ee";
    ctx.fillText(u.name, q.x + 9, q.y - 9);
  }
  return q;
}
// links, detections and shots, shared by the theatre and the follow cameras
function drawActivity(ctx, cam, units, t) {
  const pos = u => W3(u.x, u.y, u.z);
  if (show.comms) {
    const net = units.filter(u => u.alive && u.comms_km > 0);
    for (let i = 0; i < net.length; i++) for (let j = i + 1; j < net.length; j++) {
      const a = net[i], b = net[j];
      if (a.side !== b.side) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) > Math.min(a.comms_km, b.comms_km)) continue;
      line3(ctx, cam, pos(a), pos(b), C_COMMS, 1, null, 0.38);
    }
  }
  const fr = frameAt(t);
  if (show.seen) {
    for (const [o, g] of fr.d) if (units[o].alive && units[g].alive) line3(ctx, cam, pos(units[o]), pos(units[g]), C_SEEN, 1.3, [5, 4], 0.85);
    for (const [s, g] of fr.s) {
      const sat = satLocal(R.sats[s], t), u = units[g];
      if (u.alive) line3(ctx, cam, pos(u), [u.x + (sat.x - u.x) * 0.12, u.y + (sat.y - u.y) * 0.12, u.z * VZ + (sat.z - u.z) * 0.12],
                         C_SAT, 1.5, [2, 4], 0.95);
    }
  }
  if (show.shots) {
    const at0 = {};
    for (const [t0, t1, from, to, result] of R.shots) {
      if (t < t0 || t > t1 + 6) continue;
      const tgt = units[to];
      if (t <= t1) {
        const s0 = (at0[t0] ||= stateAt(t0))[from], k = (t - t0) / Math.max(1e-9, t1 - t0);
        const p = [s0.x + (tgt.x - s0.x) * k, s0.y + (tgt.y - s0.y) * k, (s0.z + (tgt.z - s0.z) * k) * VZ];
        line3(ctx, cam, W3(s0.x, s0.y, s0.z), p, C_SHOT, 1, null, 0.5);
        const q = cam.project(p);
        if (q) { ctx.fillStyle = C_SHOT; ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, 2 * Math.PI); ctx.fill(); }
      } else {
        const q = cam.project(pos(tgt)), age = (t - t1) / 6;
        if (q) {
          ctx.globalAlpha = 1 - age; ctx.strokeStyle = result === "miss" ? "#8794ad" : "#ffd9a8"; ctx.lineWidth = result === "miss" ? 1 : 2.5;
          ctx.beginPath(); ctx.arc(q.x, q.y, 6 + 22 * age, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
    }
  }
}

// ---- theatre (main 3D view) ---------------------------------------------------------------
let hits = [];
function drawTheatre(units) {
  const { ctx, w, h } = fit($("theatre"));
  drawSky(ctx, w, h);
  const centre = [R.width / 2, R.height / 2, 0], d = 0.95 * R.width * main.dist;
  const pos = [centre[0] + d * Math.cos(main.pitch) * Math.cos(main.yaw), centre[1] + d * Math.cos(main.pitch) * Math.sin(main.yaw), d * Math.sin(main.pitch)];
  const cam = camera(pos, centre, 42, w, h);
  drawTerrain(ctx, cam, 1);
  drawActivity(ctx, cam, units, T);
  hits = [];
  const order = units.map(u => [(u.x - pos[0]) ** 2 + (u.y - pos[1]) ** 2, u]).sort((a, b) => b[0] - a[0]);
  for (const [, u] of order) {
    const q = drawUnit(ctx, cam, u, 5, show.labels && u.alive);
    if (q) hits.push([q.x, q.y, u.n]);
  }
  for (const sat of R.sats) {                       // satellite passing over: an arrow at the top edge
    const s = satLocal(sat, T);
    if (s.elev < 5) continue;
    ctx.fillStyle = C_SAT; ctx.font = "11px 'IBM Plex Mono', monospace";
    ctx.fillText(`${sat.name} overhead, ${s.elev.toFixed(0)} deg above the horizon`, 10, 40 + 14 * R.sats.indexOf(sat));
  }
}

// ---- follow cameras -------------------------------------------------------------------------
const CAMS = 4;
function setupCams() {
  const picks = [];
  const first = pred => R.platforms.findIndex((p, i) => pred(p) && !picks.includes("p" + i));
  const want = [p => p.side === R.sides[0] && p.icon === "fighter", p => p.side !== R.sides[0] && !p.mobile,
                p => p.side !== R.sides[0] && p.mobile, p => p.icon === "drone"];
  for (let c = 0; c < CAMS; c++) {
    let pick = null;
    if (c === CAMS - 1 && R.sats.length) pick = "s0";
    else { let i = first(want[c]); if (i < 0) i = first(() => true); if (i >= 0) pick = "p" + i; }
    picks.push(pick);
    const sel = $(`cam-${c}-pick`);
    sel.replaceChildren();
    R.platforms.forEach((p, i) => sel.add(new Option(p.name, "p" + i)));
    R.sats.forEach((s, i) => sel.add(new Option(s.name + " (satellite)", "s" + i)));
    if (pick) sel.value = pick;
  }
}
function drawCam(c, units) {
  const { ctx, w, h } = fit($(`cam-${c}`)), pick = $(`cam-${c}-pick`).value;
  if (!pick) { ctx.clearRect(0, 0, w, h); return; }
  if (pick[0] === "s") { drawSatCam(ctx, w, h, R.sats[Number(pick.slice(1))]); return; }
  const u = units[Number(pick.slice(1))];
  drawSky(ctx, w, h);
  const ch = Math.cos(u.heading * D), sh = Math.sin(u.heading * D), flying = u.alive && u.domain === "air" && !u.landed;
  const at = W3(u.x, u.y, u.z);
  const pos = flying ? [u.x - 24 * ch, u.y - 24 * sh, at[2] + 7] : [u.x - 20, u.y - 30, at[2] + 14];
  const tgt = flying ? [u.x + 14 * ch, u.y + 14 * sh, at[2] - 1] : at;
  const cam = camera(pos, tgt, 52, w, h);
  drawTerrain(ctx, cam, 2);
  drawActivity(ctx, cam, units, T);
  units.map(o => [(o.x - pos[0]) ** 2 + (o.y - pos[1]) ** 2, o]).sort((a, b) => b[0] - a[0])
    .forEach(([, o]) => drawUnit(ctx, cam, o, o === u ? 3.2 : 4, false));
  if (!u.alive) { ctx.fillStyle = "#f2788f"; ctx.font = "11px 'IBM Plex Sans', sans-serif"; ctx.fillText("destroyed", 8, h - 8); }
}
function drawSatCam(ctx, w, h, sat) {
  ctx.fillStyle = "#070b14"; ctx.fillRect(0, 0, w, h);
  const s = satLocal(sat, T), r = vnorm(s.eci), lat = Math.asin(s.eci[2] / r), lonI = Math.atan2(s.eci[1], s.eci[0]);
  drawGlobe(ctx, w, h, { yaw: lonI, tilt: lat, zoom: 1.9 }, { cx: w / 2, cy: h * 0.62, tether: sat });
}

// ---- globe ------------------------------------------------------------------------------------
const land = LAND_TOPO && window.topojson ? topojson.feature(LAND_TOPO, LAND_TOPO.objects.land) : null;
const graticule = window.d3 ? d3.geoGraticule10() : null;
function drawGlobe(ctx, w, h, view, opt = {}) {
  const cx = opt.cx ?? w / 2, cy = opt.cy ?? h / 2;
  const reach = Math.max(RE * 1.25, ...R.sats.map(s => s.orbitObj.a * (1 + s.orbitObj.e)));
  const Rpx = Math.min(w, h) * 0.44 * view.zoom * RE / reach, k = Rpx / RE;
  const cyaw = Math.cos(view.yaw), syaw = Math.sin(view.yaw), ct = Math.cos(view.tilt), st = Math.sin(view.tilt);
  const project = p => {
    const x1 = p[0] * cyaw + p[1] * syaw, y1 = -p[0] * syaw + p[1] * cyaw;
    const up = p[2] * ct - x1 * st, depth = x1 * ct + p[2] * st;
    return { x: cx + y1 * k, y: cy - up * k, depth, hidden: depth < 0 && y1 * y1 + up * up < RE * RE };
  };
  ctx.beginPath(); ctx.arc(cx, cy, Rpx, 0, 2 * Math.PI); ctx.fillStyle = "#12305a"; ctx.fill();
  if (window.d3) {
    const proj = d3.geoOrthographic().translate([cx, cy]).scale(Rpx).clipAngle(90).rotate([-(view.yaw - WE * T) / D, -view.tilt / D]);
    const path = d3.geoPath(proj, ctx);
    if (land) { ctx.beginPath(); path(land); ctx.fillStyle = "#3f7d62"; ctx.fill(); }
    ctx.beginPath(); path(graticule); ctx.strokeStyle = "rgba(219,226,238,.16)"; ctx.lineWidth = 0.6; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, Rpx, 0, 2 * Math.PI); ctx.strokeStyle = "rgba(108,182,255,.55)"; ctx.lineWidth = 1.2; ctx.stroke();
  const o = R.space.origin, area = project(groundEci(o.lat, o.lon, T));
  if (!area.hidden && area.depth > 0) {
    ctx.save(); ctx.translate(area.x, area.y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#f2b544"; ctx.fillRect(-4, -4, 8, 8); ctx.restore();
    if (!opt.tether) { ctx.fillStyle = "#f2b544"; ctx.font = "11px 'IBM Plex Sans', sans-serif"; ctx.fillText("battle area", area.x + 9, area.y + 4); }
  }
  const seenNow = new Set(frameAt(T).s.map(x => x[0]));
  R.sats.forEach((sat, n) => {
    const orb = sat.orbitObj, color = sideColor(sat.side);
    if (!opt.tether) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.1;
      let prev = null;
      for (let i = 0; i <= 120; i++) {
        const q = project(orb.state(orb.epoch + orb.period * i / 120)[0]);
        if (prev && !prev.hidden && !q.hidden) { ctx.globalAlpha = prev.depth < 0 ? 0.3 : 0.85; ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
        prev = q;
      }
      ctx.globalAlpha = 1;
    }
    const s = satLocal(sat, T), q = project(s.eci);
    if (q.hidden) return;
    if (s.elev >= sat.min_elev && !area.hidden) {          // in view of the battle area
      ctx.strokeStyle = seenNow.has(n) ? C_SEEN : C_SAT; ctx.lineWidth = seenNow.has(n) ? 2 : 1.3; ctx.setLineDash(seenNow.has(n) ? [] : [3, 4]);
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(area.x, area.y); ctx.stroke(); ctx.setLineDash([]);
    }
    if (opt.tether === sat) {                              // close-up: body and solar panels
      const b = Math.max(7, Math.min(w, h) * 0.06);
      ctx.fillStyle = "#6c7fa8"; ctx.fillRect(q.x - 3.6 * b, q.y - 0.45 * b, 2.4 * b, 0.9 * b); ctx.fillRect(q.x + 1.2 * b, q.y - 0.45 * b, 2.4 * b, 0.9 * b);
      ctx.fillStyle = color; ctx.fillRect(q.x - b, q.y - 0.8 * b, 2 * b, 1.6 * b);
      ctx.strokeStyle = "#0d1422"; ctx.lineWidth = 1; ctx.strokeRect(q.x - b, q.y - 0.8 * b, 2 * b, 1.6 * b);
    } else {
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(q.x, q.y, 4.5, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = "#0d1422"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.font = "12px 'IBM Plex Mono', monospace"; ctx.fillText(sat.name, q.x + 8, q.y - 8);
    }
  });
}
function drawGlobeView() {
  if (!R.sats.length) return;
  const { ctx, w, h } = fit($("globe"));
  ctx.fillStyle = "#070b14"; ctx.fillRect(0, 0, w, h);
  if (!globeView.set) {                                    // start looking at the battle area, a little off to one side
    const o = R.space.origin;
    globeView.yaw = o.lon * D + WE * T + 0.45; globeView.tilt = Math.max(-1.2, Math.min(1.2, o.lat * D - 0.2)); globeView.zoom = 1; globeView.set = true;
  }
  drawGlobe(ctx, w, h, globeView);
}

// ---- overlays, clock, loop ------------------------------------------------------------------------
const clock = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s) % 60).padStart(2, "0")}`;
let lastEventKey = "";
function drawOverlays(units) {
  $("clock").textContent = `${clock(T)} / ${clock(R.end)}`;
  if (document.activeElement !== $("scrub")) $("scrub").value = T;
  const recent = R.events.filter(e => e[0] <= T && e[1] !== "MISS").slice(-5), key = recent.length + ":" + (recent.length ? recent[recent.length - 1][0] + recent[recent.length - 1][2] : "");
  if (key !== lastEventKey) {
    lastEventKey = key;
    const box = $("events");
    box.replaceChildren();
    for (const [t, kind, text] of recent) {
      const row = document.createElement("div"), tag = document.createElement("b");
      tag.textContent = `${clock(t)} ${kind} `;
      tag.className = kind === "KILL" || kind === "LOST" ? "bad" : "";
      row.append(tag, text);
      box.append(row);
    }
  }
  const u = selected !== null ? units[selected] : null;
  $("readout").textContent = u ? `${u.name} · ${u.kind} · ${u.side} · ` + (u.alive
    ? `alt ${u.z.toFixed(1)} km` + (u.fuel >= 0 ? ` · fuel ${(u.fuel * 100).toFixed(0)}%` : "") + (u.landed ? " · landed" : "")
    : "destroyed") : "";
}
function setPlaying(on) { playing = on; $("btn-play").textContent = on ? "Pause" : "Play"; $("btn-play").setAttribute("aria-pressed", String(on)); }
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (R) {
    if (playing) { T += dt * Number($("speed").value); if (T >= R.end) { T = R.end; setPlaying(false); } }
    const units = stateAt(T);
    drawTheatre(units);
    for (let c = 0; c < CAMS; c++) drawCam(c, units);
    drawGlobeView();
    drawOverlays(units);
  }
  requestAnimationFrame(frame);
}

// ---- controls ------------------------------------------------------------------------------------------
$("btn-play").addEventListener("click", () => { if (!playing && R && T >= R.end) T = 0; setPlaying(!playing); });
$("scrub").addEventListener("input", () => { T = Number($("scrub").value); });
for (const key of Object.keys(show)) $("show-" + key).addEventListener("change", e => { show[key] = e.target.checked; });

function dragView(canvas, onDrag, onClick, onWheel) {
  let drag = null;
  canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    onDrag(dx, dy);
  });
  canvas.addEventListener("pointerup", e => { if (drag && drag.moved < 4 && onClick) onClick(e); drag = null; });
  canvas.addEventListener("pointercancel", () => { drag = null; });
  canvas.addEventListener("wheel", e => { e.preventDefault(); onWheel(e.deltaY < 0 ? 1 / 1.1 : 1.1); }, { passive: false });
}
dragView($("theatre"),
  (dx, dy) => { main.yaw -= dx * 0.006; main.pitch = Math.max(8 * D, Math.min(86 * D, main.pitch + dy * 0.005)); },
  e => {
    const box = $("theatre").getBoundingClientRect(), x = e.clientX - box.left, y = e.clientY - box.top;
    let best = null;
    for (const [hx, hy, n] of hits) { const d = Math.hypot(hx - x, hy - y); if (d < 16 && (!best || d < best[0])) best = [d, n]; }
    selected = best ? (selected === best[1] ? null : best[1]) : null;
  },
  f => { main.dist = Math.max(0.25, Math.min(2.5, main.dist * f)); });
dragView($("globe"),
  (dx, dy) => { globeView.yaw -= dx / (200 * globeView.zoom); globeView.tilt = Math.max(-89 * D, Math.min(89 * D, globeView.tilt + dy / (200 * globeView.zoom))); },
  null, f => { globeView.zoom = Math.max(0.5, Math.min(8, globeView.zoom / f)); });

$("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  try { load(JSON.parse(await file.text()), `Loaded ${file.name}`); setPlaying(true); }
  catch (err) { note(`Could not open ${file.name}: ${err.message}. Record one with: python -m minisim SCENARIO --replay run.json`, true); }
  e.target.value = "";
});

if (LOCAL) {
  $("local").hidden = false;
  fetch("api/scenarios").then(r => r.json()).then(names => {
    names.forEach(n => $("scenario").add(new Option(n.replace(/\.json$/, "").replace(/_/g, " "), n)));
    if (names.includes("overwatch.json")) $("scenario").value = "overwatch.json";
  }).catch(() => note("Could not list scenarios from the minisim server.", true));
  $("run-form").addEventListener("submit", async e => {
    e.preventDefault();
    note("Running...");
    try {
      const res = await fetch("api/replay", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scenario: $("scenario").value, seed: Number($("seed").value) || 1 }) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      load(data, `Ran ${$("scenario").value} with seed ${$("seed").value}`); setPlaying(true);
    } catch (err) { note("Run failed: " + err.message, true); }
  });
}

// ---- start --------------------------------------------------------------------------------------------------
try { load(SAMPLE, "Showing a recorded sample run. Open a replay file to view your own."); }
catch (err) { note("The sample replay could not be loaded: " + err.message, true); }
setPlaying(playing);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
